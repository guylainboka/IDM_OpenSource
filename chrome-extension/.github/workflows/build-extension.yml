name: Build Extension

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          cat manifest.json
          python3 -c "import json; json.load(open('manifest.json'))" && echo "Manifest JSON OK"

      - name: Check required files exist
        run: |
          for f in manifest.json background.js content.js popup.html popup.js options.html options.js styles.css icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png; do
            test -f "$f" && echo "OK: $f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Package extension
        run: |
          zip -r guymadown-extension.zip . \
            -x "*.git*" "*.github*" "*.DS_Store" "README.md"
          ls -la guymadown-extension.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guymadown-extension
          path: guymadown-extension.zip
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: guymadown-extension.zip
          name: guymadown Extension ${{ github.ref_name }}
          body: |
            ## Extension Chrome guymadown ${{ github.ref_name }}

            ### Installation
            1. Téléchargez `guymadown-extension.zip` et décompressez-le
            2. Chrome → `chrome://extensions/` → Mode développeur
            3. « Charger l'extension non empaquetée » → sélectionnez le dossier
            4. Démarrez le moteur guymadown sur votre PC
          draft: false
          prerelease: false
